version: 2
updates:
  # npm dependencies. Playwright ships a new minor roughly every month and the
  # browsers move with it, so staying current is part of keeping the suite honest.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole dev toolchain instead of five separate ones.
      dev-tooling:
        patterns:
          - '@playwright/*'
          - 'playwright*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript*'
          - 'prettier'
          - 'tsx'
          - '@types/*'
    ignore:
      # typescript-eslint 8 declares "typescript": ">=4.8.4 <6.1.0", so a major
      # TypeScript bump breaks peer resolution and npm ci fails before anything
      # is even linted. Minor and patch updates still come through.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'deps'

  # The pinned action versions in .github/workflows.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
