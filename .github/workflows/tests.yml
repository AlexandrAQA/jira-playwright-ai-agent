name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run pointless: cancel it
# instead of paying for two runs of the same code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the publishing job widens this for itself only.
permissions:
  contents: read

jobs:
  # Everything that needs no browser. It finishes in well under a minute, so a
  # badly formatted or badly typed change never reaches the expensive job.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=optional

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Quality gate specific to agent-generated tests: rejects a spec that is
      # green but worthless (no assertion, URL jumping, brittle selector, inline login).
      - name: Generated-test quality gate
        run: npm run lint:tests

      # Retrieval unit tests. No browser, so they belong in this job: a knowledge
      # base that stopped answering a question fails here in a second.
      - name: Unit tests
        run: npm run test:unit

      # Known vulnerabilities. Dependabot opens the fix PRs; this step is what
      # stops an advisory from sitting unnoticed between those PRs.
      #
      # --omit=optional is not a way of looking away. The only optional
      # dependency is the embedding model used to build the knowledge index on a
      # developer machine; the two lines above install without it, so auditing
      # it here would be auditing code that is not present in this job.
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=optional

  e2e:
    needs: quality
    # GitHub withholds repository secrets from Dependabot pull requests on
    # purpose, so the login credentials would be empty and every test would fail
    # on a timeout. Dependency updates get the quality job, which needs no
    # secrets; the suite runs again on main once the update is merged.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=optional

      # Without this the whole suite fails one timeout at a time and the run
      # takes ten minutes to say "the secret is missing".
      - name: Check the test credentials are available
        env:
          SAUCE_USER: ${{ secrets.SAUCE_USER }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        run: |
          if [ -z "$SAUCE_USER" ] || [ -z "$SAUCE_PASSWORD" ]; then
            echo "::error::SAUCE_USER / SAUCE_PASSWORD are not available to this run."
            exit 1
          fi

      - run: npx playwright install --with-deps chromium

      # Only the browser project: the unit project already ran in `quality`.
      - run: npm run test:e2e
        env:
          SAUCE_USER: ${{ secrets.SAUCE_USER }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      # Short failure digest straight on the run page, so nothing has to be
      # downloaded to see what broke.
      - name: Failure summary
        if: failure()
        run: npx tsx scripts/summarize-failures.ts >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Raw traces, videos and the JUnit XML. Traces open in the Playwright
      # trace viewer, JUnit is what test dashboards consume.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 7

  # Publishing the report lives in .github/workflows/report.yml, on purpose:
  # this workflow's badge has to mean "the tests pass". A failure to publish an
  # HTML report is not a test failure and must not be able to claim it is.
