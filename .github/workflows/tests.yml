name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Quality gate for agent-generated tests. Runs before the browsers are
      # installed, so a worthless-but-green test fails the build in seconds.
      - run: npm run lint:tests

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
        env:
          SAUCE_USER: ${{ secrets.SAUCE_USER }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      # Short failure digest straight on the run page, so nothing has to be
      # downloaded to see what broke.
      - name: Failure summary
        if: failure()
        run: npx tsx scripts/summarize-failures.ts >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Raw traces, videos and the JUnit XML. Traces open in the Playwright
      # trace viewer, JUnit is what test dashboards consume.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 7